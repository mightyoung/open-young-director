name: young-writer tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --dev
      - name: Check lockfile
        run: uv lock --check
      - name: Run tests
        run: uv run pytest lib/knowledge_base/tests -q
      - name: Build wheel
        run: uv build --package young_writer --out-dir dist
