name = "young-writer-workspace"
description = "Local long-form fiction writing workbench centered on lib/knowledge_base."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "young-writer" }
]

[dependency-groups]
dev = [
    "ruff==0.15.1",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "bandit==1.9.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "types-psycopg2==2.9.21.20251012",
]

[tool.ruff]
src = ["lib/knowledge_base"]
respect-gitignore = true
force-exclude = true
fix = true
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
future-annotations = true
extend-select = [
    "E",
    "F",
    "B",
    "S",
    "RUF",
    "N",
    "W",
    "I",
    "T",
    "PERF",
    "PIE",
    "TID",
    "ASYNC",
    "RET",
    "UP006",
    "UP007",
    "UP035",
    "UP037",
    "UP045",
    "UP004",
    "UP008",
    "UP010",
    "UP018",
    "UP031",
    "UP032",
    "I001",
    "I002",
]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
no-sections = false
case-sensitive = true
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["young_writer", "knowledge_base"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.per-file-ignores]
"lib/knowledge_base/tests/**/*.py" = ["S101", "RET504", "S105", "S106", "B017", "F841"]
"lib/knowledge_base/young_writer/agents/novel_generator.py" = ["F841", "PERF401", "RET504", "RUF001", "RUF003", "RUF013", "S110"]
"lib/knowledge_base/run_novel_generation.py" = ["RUF001", "RUF002", "RUF003", "RUF005", "S603", "T201"]
"lib/knowledge_base/young_writer/services/longform_run.py" = ["RUF001"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
    "slow: mark test as slow running",
]
testpaths = [
    "lib/knowledge_base/tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short --timeout=60 --import-mode=importlib"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.uv]
override-dependencies = [
    "rich>=13.7.1",
    "onnxruntime<1.24; python_version < '3.11'",
    "pillow>=12.1.1",
    "langchain-core>=0.3.80,<1",
    "urllib3>=2.6.3",
]

[tool.uv.workspace]
members = [
    "lib/knowledge_base",
]

[tool.uv.sources]
young_writer = { workspace = true }
